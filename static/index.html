<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gum</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; background: #0b0e11; color: #c9d1d9;
         font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #banner { display: none; background: #5c3b00; color: #ffcc66; padding: 4px 12px; font-weight: bold; }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
  #log div { min-height: 1.45em; }
  #bar { display: flex; border-top: 1px solid #30363d; padding: 8px 12px; }
  #prefix { color: #58a6ff; margin-right: 8px; white-space: nowrap; }
  #input { flex: 1; background: transparent; border: 0; outline: 0; color: inherit; font: inherit; }
  .user { color: #e6edf3; }
  .green { color: #3fb950; }
  .cyan { color: #39c5cf; }
  .magenta { color: #d670d6; }
  .yellow { color: #a8923a; }
  .red { color: #f85149; }
  .amber { color: #ffb000; }
  .dim { color: #6e7681; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="log"></div>
<div id="bar"><span id="prefix"></span><input id="input" type="text" autocomplete="off" spellcheck="false" autofocus></div>
<script>
"use strict";

// Incremental SSE parser: push() takes decoded text chunks, returns completed {event, data} objects.
function createSSEParser() {
  let buf = "";
  return {
    push(chunk) {
      buf = (buf + chunk).replace(/\r\n/g, "\n");
      const out = [];
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const block = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let event = "message";
        const data = [];
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
        }
        if (!data.length) continue;
        try { out.push({ event, data: JSON.parse(data.join("\n")) }); } catch (e) { /* skip malformed */ }
      }
      return out;
    },
  };
}

const num = (x, d) => Number(x).toFixed(d);

function formatGuardrail(d) {
  const conf = d.confidence == null ? "" : ` (${num(d.confidence, 2)})`;
  const ms = d.latency_ms == null ? "" : ` ${Math.round(d.latency_ms)}ms`;
  if (d.status === "passed") return { text: `[JEV GUARDRAIL: PASSED${conf}]${ms}`, cls: "green" };
  if (d.status === "blocked") return { text: `[JEV GUARDRAIL: BLOCKED — ${d.reason}${conf}]${ms}`, cls: "red" };
  return { text: `[JEV GUARDRAIL: ERROR — fail-closed]${ms}`, cls: "amber" };
}

function formatRoute(r) {
  const jevConf = num(r.jev_tier === "lite" ? r.p_simple : 1 - r.p_simple, 2);
  if (r.source === "override") {
    return { text: `[JEV ROUTE: ${r.tier} (override; jev→${r.jev_tier} ${jevConf})]`, cls: "yellow" };
  }
  const label = r.tier === "lite" ? "simple" : "complex";
  return { text: `[JEV ROUTE: ${r.tier} ← ${label} (${jevConf})]`, cls: r.tier === "lite" ? "cyan" : "magenta" };
}

function formatFooter(d) {
  if (!d.model) return null;
  const parts = [d.model];
  const lat = d.latency_ms || {};
  if (lat.ttft != null) parts.push(`ttft ${Math.round(lat.ttft)}ms`);
  if (d.usage) parts.push(`${d.usage.input_tokens}→${d.usage.output_tokens} tok`);
  if (d.cost_usd != null) parts.push(`$${num(d.cost_usd, 5)}`);
  return "  · " + parts.join(" · ");
}

function parseCommand(s) {
  const m = /^\/(\w+)\s*(.*)$/.exec(s.trim());
  return m ? { name: m[1], arg: m[2].trim() } : null;
}

function createHistory() {
  const items = [];
  let pos = 0;
  let draft = "";
  return {
    add(s) { if (s && items[items.length - 1] !== s) items.push(s); pos = items.length; },
    up(current) {
      if (pos === items.length) draft = current;
      if (pos > 0) pos--;
      return items.length ? items[pos] : current;
    },
    down() {
      if (pos >= items.length) return draft;
      pos++;
      return pos === items.length ? draft : items[pos];
    },
  };
}

function formatStats(stats) {
  const rows = [];
  const cell = (v) => (v == null ? "—" : typeof v === "number" ? String(Math.round(v * 100) / 100) : String(v));
  for (const [k, v] of Object.entries(stats)) {
    if (v && typeof v === "object") {
      for (const [k2, v2] of Object.entries(v)) rows.push([`${k}.${k2}`, cell(v2)]);
    } else rows.push([k, cell(v)]);
  }
  const width = Math.max(0, ...rows.map((r) => r[0].length)) + 2;
  return rows.map(([k, v]) => k.padEnd(width) + v).join("\n");
}

const nearBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 24;

window.Gum = { createSSEParser, formatGuardrail, formatRoute, formatFooter, parseCommand, createHistory, formatStats, nearBottom };
</script>
</body>
</html>
