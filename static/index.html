<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gum</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b0e11; --fg: #c9d1d9; --border: #30363d; --user: #e6edf3;
    --green: #3fb950; --cyan: #39c5cf; --magenta: #d670d6; --yellow: #a8923a;
    --red: #f85149; --amber: #ffb000; --dim: #6e7681; --accent: #58a6ff;
    --panel-bg: #10151b; --marker: #ffb000;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #banner { display: none; background: #5c3b00; color: #ffcc66; padding: 4px 12px; font-weight: bold; }
  #app { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  #chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
  #log div { min-height: 1.45em; }
  #bar { display: flex; border-top: 1px solid var(--border); padding: 8px 12px; }
  #prefix { color: var(--accent); margin-right: 8px; white-space: nowrap; }
  #input { flex: 1; background: transparent; border: 0; outline: 0; color: inherit; font: inherit; }
  #divider { flex: 0 0 6px; background: var(--border); cursor: col-resize; }
  #devlog-panel { flex: 0 0 40%; min-width: 280px; display: flex; flex-direction: column;
                  min-height: 0; background: var(--panel-bg); border-left: 1px solid var(--border); }
  #devlog-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
                   border-bottom: 1px solid var(--border); }
  [data-testid="devlog-status"] { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  [data-testid="devlog-status"][data-state="live"] { background: var(--green); }
  [data-testid="devlog-status"][data-state="reconnecting"] { background: var(--amber); }
  [data-testid="devlog-status"][data-state="disabled"] { background: var(--dim); }
  #devlog-cards { flex: 1; overflow-y: auto; padding: 8px 10px; }
  [data-testid="devlog-card"] { border: 1px solid var(--border); border-radius: 4px;
                                 padding: 8px 10px; margin-bottom: 8px; font-size: 12px; }
  .devlog-card-header { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .devlog-time, .devlog-turn-index { color: var(--dim); }
  .devlog-preview { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .devlog-badge { font-weight: bold; }
  .devlog-question { margin: 4px 0; }
  .devlog-question-label { color: var(--dim); font-size: 11px; }
  [data-testid="devlog-bar"] { background: #1c232c; border-radius: 2px; overflow: visible; }
  .devlog-bar-fill { background: var(--cyan); border-radius: 2px; }
  [data-testid="devlog-scope-bar"]:nth-of-type(1) { background: var(--cyan); }
  [data-testid="devlog-scope-bar"]:nth-of-type(2) { background: var(--magenta); }
  [data-testid="devlog-scope-bar"]:nth-of-type(3) { background: var(--yellow); }
  [data-testid="devlog-threshold-marker"] { background: var(--marker); }
  .devlog-oneliner { color: var(--dim); margin: 4px 0; }
  [data-testid="devlog-timing"] { color: var(--dim); font-size: 11px; margin: 4px 0; }
  .devlog-raw button { background: transparent; color: var(--accent); border: 0; font: inherit;
                        cursor: pointer; padding: 0; margin-right: 10px; }
  .devlog-raw pre { white-space: pre-wrap; word-break: break-word; background: #06090c;
                     padding: 6px; border-radius: 3px; }
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    #divider { cursor: row-resize; }
    #devlog-panel { border-left: none; border-top: 1px solid var(--border); }
  }
  .user { color: var(--user); }
  .green { color: var(--green); }
  .cyan { color: var(--cyan); }
  .magenta { color: var(--magenta); }
  .yellow { color: var(--yellow); }
  .red { color: var(--red); }
  .amber { color: var(--amber); }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<div id="banner"></div>
<div id="app">
  <div id="chat-panel" data-testid="chat-panel">
    <div id="log"></div>
    <div id="bar"><span id="prefix"></span><input id="input" type="text" autocomplete="off" spellcheck="false" autofocus></div>
  </div>
  <div id="divider"></div>
  <div id="devlog-panel" data-testid="devlog-panel">
    <div id="devlog-header">
      <span data-testid="devlog-status" data-state="reconnecting"></span>
      <span class="dim">Jev dev console</span>
    </div>
    <div id="devlog-cards"></div>
  </div>
</div>
<script>
"use strict";

// Incremental SSE parser: push() takes decoded text chunks, returns completed {event, data} objects.
function createSSEParser() {
  let buf = "";
  return {
    push(chunk) {
      buf = (buf + chunk).replace(/\r\n/g, "\n");
      const out = [];
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const block = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let event = "message";
        const data = [];
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
        }
        if (!data.length) continue;
        try { out.push({ event, data: JSON.parse(data.join("\n")) }); } catch (e) { /* skip malformed */ }
      }
      return out;
    },
  };
}

const num = (x, d) => Number(x).toFixed(d);

function formatGuardrail(d) {
  const conf = d.confidence == null ? "" : ` (${num(d.confidence, 2)})`;
  const ms = d.latency_ms == null ? "" : ` ${Math.round(d.latency_ms)}ms`;
  if (d.status === "passed") return { text: `[JEV GUARDRAIL: PASSED${conf}]${ms}`, cls: "green" };
  if (d.status === "blocked") return { text: `[JEV GUARDRAIL: BLOCKED — ${d.reason}${conf}]${ms}`, cls: "red" };
  return { text: `[JEV GUARDRAIL: ERROR — fail-closed]${ms}`, cls: "amber" };
}

function formatRoute(r) {
  const jevConf = num(r.jev_tier === "lite" ? r.p_simple : 1 - r.p_simple, 2);
  if (r.source === "override") {
    return { text: `[JEV ROUTE: ${r.tier} (override; jev→${r.jev_tier} ${jevConf})]`, cls: "yellow" };
  }
  const label = r.tier === "lite" ? "simple" : "complex";
  return { text: `[JEV ROUTE: ${r.tier} ← ${label} (${jevConf})]`, cls: r.tier === "lite" ? "cyan" : "magenta" };
}

function formatFooter(d) {
  if (!d.model) return null;
  const parts = [d.model];
  const lat = d.latency_ms || {};
  if (lat.ttft != null) parts.push(`ttft ${Math.round(lat.ttft)}ms`);
  if (d.usage) parts.push(`${d.usage.input_tokens}→${d.usage.output_tokens} tok`);
  if (d.cost_usd != null) parts.push(`$${num(d.cost_usd, 5)}`);
  return "  · " + parts.join(" · ");
}

function parseCommand(s) {
  const m = /^\/(\w+)\s*(.*)$/.exec(s.trim());
  return m ? { name: m[1], arg: m[2].trim() } : null;
}

function createHistory() {
  const items = [];
  let pos = 0;
  let draft = "";
  return {
    add(s) { if (s && items[items.length - 1] !== s) items.push(s); pos = items.length; },
    up(current) {
      if (pos === items.length) draft = current;
      if (pos > 0) pos--;
      return items.length ? items[pos] : current;
    },
    down() {
      if (pos >= items.length) return draft;
      pos++;
      return pos === items.length ? draft : items[pos];
    },
  };
}

function formatStats(stats) {
  const rows = [];
  const cell = (v) => (v == null ? "—" : typeof v === "number" ? String(Math.round(v * 100) / 100) : String(v));
  for (const [k, v] of Object.entries(stats)) {
    if (v && typeof v === "object") {
      for (const [k2, v2] of Object.entries(v)) rows.push([`${k}.${k2}`, cell(v2)]);
    } else rows.push([k, cell(v)]);
  }
  const width = Math.max(0, ...rows.map((r) => r[0].length)) + 2;
  return rows.map(([k, v]) => k.padEnd(width) + v).join("\n");
}

const nearBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 24;

// ---- devlog console: pure helpers ----

const DEVLOG_EVENT_FIELDS = {
  "turn.start": (t, d) => ({ ...t, message: d.message }),
  "jev.request": (t, d) => ({ ...t, request: d }),
  "jev.response": (t, d) => ({ ...t, response: d }),
  "jev.decision": (t, d) => ({ ...t, decision: d, jevMs: d.t_ms }),
  "jev.error": (t, d) => ({ ...t, error: d }),
  "llm.start": (t, d) => ({ ...t, llmStart: d }),
  "llm.first_token": (t, d) => ({ ...t, ttftMs: d.ttft_ms }),
  "llm.done": (t, d) => ({ ...t, llmDone: d }),
  "turn.end": (t, d) => ({ ...t, outcome: d.outcome, totalMs: d.total_ms }),
};

function mergeDevlogEvent(turn, name, data) {
  const fold = DEVLOG_EVENT_FIELDS[name];
  return fold ? fold(turn, data) : turn;
}

function devlogBadge(turn) {
  if (turn.outcome === "answered") {
    const tier = (turn.decision && turn.decision.route && turn.decision.route.tier)
      || (turn.decision && turn.decision.complexity && turn.decision.complexity.tier)
      || "?";
    return { text: `PASS → ${tier}`, cls: "green" };
  }
  if (turn.outcome === "blocked") {
    const reason = (turn.decision && turn.decision.reason) || "?";
    return { text: `BLOCKED (${reason})`, cls: "red" };
  }
  return { text: "ERROR", cls: "amber" };
}

function devlogTimingText(turn) {
  const parts = [];
  if (turn.jevMs != null) parts.push(`jev ${Math.round(turn.jevMs)}ms`);
  if (turn.llmStart && turn.ttftMs != null) parts.push(`ttft ${Math.round(turn.ttftMs)}ms`);
  if (turn.totalMs != null) parts.push(`total ${Math.round(turn.totalMs)}ms`);
  if (turn.llmStart && turn.llmStart.model) parts.push(turn.llmStart.model);
  return parts.join(" · ");
}

const devlogBarPct = (p) => Math.max(0, Math.min(1, p));

const scopeBars = (scope) => Object.entries(scope.probabilities).map(([label, p]) => ({ label, p }));

function loadDevlogVisible(storage) {
  const s = storage || window.localStorage;
  try {
    const v = s.getItem("devlog_visible");
    return v === null ? true : v === "true";
  } catch (e) {
    return true;
  }
}

function saveDevlogVisible(visible, storage) {
  const s = storage || window.localStorage;
  try {
    s.setItem("devlog_visible", String(visible));
  } catch (e) { /* private browsing / disabled storage: ignore */ }
}

function _el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") e.textContent = v;
    else if (k.startsWith("data-")) e.setAttribute(k, v);
    else if (k === "style") e.setAttribute("style", v);
    else e.setAttribute(k, v);
  }
  for (const c of children || []) e.appendChild(c);
  return e;
}

function _threshMarker(threshold) {
  return _el("div", {
    "data-testid": "devlog-threshold-marker",
    style: `position:absolute;top:0;bottom:0;left:${devlogBarPct(threshold) * 100}%;width:2px;`,
  });
}

function _questionBar(name, question) {
  const track = _el("div", {
    "data-testid": "devlog-bar",
    "data-question": name,
    style: "position:relative;width:100%;height:10px;",
  });
  if (name === "scope") {
    let offset = 0;
    for (const { label, p } of scopeBars(question)) {
      const seg = _el("div", {
        "data-testid": "devlog-scope-bar",
        "data-label": label,
        style: `position:absolute;top:0;bottom:0;left:${offset * 100}%;width:${devlogBarPct(p) * 100}%;`,
      });
      offset += p;
      track.appendChild(seg);
    }
  } else {
    const value = name === "unsafe" ? question.p : question.p_simple;
    track.appendChild(_el("div", {
      class: "devlog-bar-fill",
      style: `position:absolute;top:0;bottom:0;left:0;width:${devlogBarPct(value) * 100}%;`,
    }));
  }
  track.appendChild(_threshMarker(question.threshold));
  return _el("div", { class: "devlog-question" }, [
    _el("div", { class: "devlog-question-label", text: name }),
    track,
  ]);
}

function _rawSection(kind, obj) {
  const toggle = _el("button", { "data-testid": `devlog-${kind}-toggle`, type: "button", text: `▸ ${kind}` });
  const json = _el("pre", { "data-testid": `devlog-${kind}-json`, hidden: "" });
  json.textContent = JSON.stringify(obj ?? null, null, 2);
  toggle.addEventListener("click", () => { json.hidden = !json.hidden; });
  return [toggle, json];
}

function buildDevlogCard(turn, index) {
  const badge = devlogBadge(turn);
  const preview = (turn.message || "").slice(0, 60);
  const time = turn.ts ? new Date(turn.ts).toLocaleTimeString() : "";
  const card = _el("div", { "data-testid": "devlog-card", "data-outcome": turn.outcome || "" });
  card.appendChild(_el("div", { class: "devlog-card-header" }, [
    _el("span", { class: "devlog-time", text: time }),
    _el("span", { class: "devlog-turn-index", text: `#${index}` }),
    _el("span", { class: "devlog-preview", text: preview }),
    _el("span", { class: `devlog-badge ${badge.cls}`, text: badge.text }),
  ]));
  if (turn.decision && turn.decision.unsafe != null) {
    const bars = _el("div", { class: "devlog-bars" }, [
      _questionBar("unsafe", turn.decision.unsafe),
      _questionBar("scope", turn.decision.scope),
      _questionBar("complexity", turn.decision.complexity),
    ]);
    card.appendChild(bars);
  }
  if (turn.decision && turn.decision.explanation) {
    card.appendChild(_el("div", { class: "devlog-oneliner", text: turn.decision.explanation }));
  }
  card.appendChild(_el("div", { "data-testid": "devlog-timing", text: devlogTimingText(turn) }));
  const raw = _el("div", { class: "devlog-raw" });
  for (const c of _rawSection("request", turn.request)) raw.appendChild(c);
  for (const c of _rawSection("response", turn.response)) raw.appendChild(c);
  card.appendChild(raw);
  return card;
}

window.Gum = {
  createSSEParser, formatGuardrail, formatRoute, formatFooter, parseCommand, createHistory,
  formatStats, nearBottom, mergeDevlogEvent, devlogBadge, devlogTimingText, devlogBarPct,
  scopeBars, loadDevlogVisible, saveDevlogVisible, buildDevlogCard,
};

// ---- app wiring ----
const logEl = document.getElementById("log");
const inputEl = document.getElementById("input");
const prefixEl = document.getElementById("prefix");
const bannerEl = document.getElementById("banner");
const history = createHistory();
let tier = "auto";
let stick = true;
let queue = Promise.resolve();

const newThreadId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
function threadId() {
  let id = sessionStorage.getItem("thread_id");
  if (!id) { id = newThreadId(); sessionStorage.setItem("thread_id", id); }
  return id;
}

function scrollDown() { if (stick) logEl.scrollTop = logEl.scrollHeight; }
logEl.addEventListener("scroll", () => { stick = nearBottom(logEl); });

function line(text, cls) {
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = text;
  logEl.appendChild(el);
  scrollDown();
  return el;
}

function setPrefix() { prefixEl.textContent = `[${tier}] >`; }

async function handleEvent(ev, turn) {
  const d = ev.data;
  if (ev.event === "guardrail") { const f = formatGuardrail(d); line(f.text, f.cls); }
  else if (ev.event === "route") { const f = formatRoute(d); line(f.text, f.cls); }
  else if (ev.event === "token") {
    if (!turn.out) turn.out = line("", "");
    turn.out.textContent += d.text;
    scrollDown();
  } else if (ev.event === "error") line(`[ERROR: ${d.message}]`, "red");
  else if (ev.event === "done") { const f = formatFooter(d); if (f) line(f, "dim"); }
}

async function chat(message) {
  const turn = { out: null };
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread_id: threadId(), message, tier }),
    });
    if (!res.ok || !res.body) { line(`[ERROR: HTTP ${res.status}]`, "red"); return; }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    const parser = createSSEParser();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      for (const ev of parser.push(decoder.decode(value, { stream: true }))) await handleEvent(ev, turn);
    }
  } catch (e) {
    line(`[ERROR: ${e.message}]`, "red");
  }
}

async function showStats() {
  try {
    const res = await fetch("/api/stats");
    line(formatStats(await res.json()), "dim");
  } catch (e) { line(`[ERROR: ${e.message}]`, "red"); }
}

async function submit(text) {
  const cmd = parseCommand(text);
  if (!cmd) { line(`[${tier}] > ${text}`, "user"); await chat(text); return; }
  line(`${prefixEl.textContent} ${text}`, "user");
  if (cmd.name === "model") {
    if (["auto", "flash", "lite"].includes(cmd.arg)) { tier = cmd.arg; setPrefix(); line(`model override: ${tier}`, "dim"); }
    else line("usage: /model auto|flash|lite", "amber");
  } else if (cmd.name === "stats") await showStats();
  else if (cmd.name === "clear") {
    sessionStorage.setItem("thread_id", newThreadId());
    logEl.textContent = "";
    stick = true;
  } else if (cmd.name === "devlog") toggleDevlogVisible();
  else line(`unknown command: /${cmd.name}`, "amber");
}

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    history.add(text);
    queue = queue.then(() => submit(text)).catch(() => {});
  } else if (e.key === "ArrowUp") { e.preventDefault(); inputEl.value = history.up(inputEl.value); }
  else if (e.key === "ArrowDown") { e.preventDefault(); inputEl.value = history.down(); }
});

fetch("/healthz").then((r) => r.json()).then((h) => {
  if (h.jev_backend === "stub") {
    bannerEl.textContent = "OFFLINE — stub Jev and fake chat models; no API keys in use";
    bannerEl.style.display = "block";
  }
}).catch(() => {});

setPrefix();
threadId();
inputEl.focus();

// ---- devlog console wiring ----
const appEl = document.getElementById("app");
const dividerEl = document.getElementById("divider");
const devlogPanelEl = document.getElementById("devlog-panel");
const devlogCardsEl = document.getElementById("devlog-cards");
const devlogStatusEl = document.querySelector('[data-testid="devlog-status"]');
const devlogTurns = new Map();
const devlogOrder = [];

let devlogVisible = loadDevlogVisible();
function setDevlogVisible(visible) {
  devlogVisible = visible;
  devlogPanelEl.hidden = !visible;
  dividerEl.hidden = !visible;
  saveDevlogVisible(visible);
}
function toggleDevlogVisible() { setDevlogVisible(!devlogVisible); }
setDevlogVisible(devlogVisible);

window.addEventListener("keydown", (e) => {
  if (e.ctrlKey && (e.key === "\\" || e.code === "Backslash")) {
    e.preventDefault();
    toggleDevlogVisible();
  }
});

let devlogDragging = false;
dividerEl.addEventListener("pointerdown", (e) => {
  devlogDragging = true;
  dividerEl.setPointerCapture(e.pointerId);
});
window.addEventListener("pointerup", () => { devlogDragging = false; });
window.addEventListener("pointermove", (e) => {
  if (!devlogDragging) return;
  const rect = appEl.getBoundingClientRect();
  const stacked = getComputedStyle(appEl).flexDirection.startsWith("column");
  if (stacked) {
    const h = rect.bottom - e.clientY;
    devlogPanelEl.style.flexBasis = `${Math.max(120, Math.min(rect.height - 120, h))}px`;
  } else {
    const w = rect.right - e.clientX;
    devlogPanelEl.style.flexBasis = `${Math.max(240, Math.min(rect.width - 240, w))}px`;
  }
});

function setDevlogStatus(state) { devlogStatusEl.dataset.state = state; }

function renderDevlogCard(turnId) {
  const turn = devlogTurns.get(turnId);
  const idx = devlogOrder.indexOf(turnId) + 1;
  const card = buildDevlogCard(turn, idx);
  card.dataset.turnId = turnId;
  const stickBottom = nearBottom(devlogCardsEl);
  const existing = devlogCardsEl.querySelector(`[data-turn-id="${turnId}"]`);
  if (existing) existing.replaceWith(card);
  else devlogCardsEl.appendChild(card);
  if (stickBottom) devlogCardsEl.scrollTop = devlogCardsEl.scrollHeight;
}

function handleDevlogEvent(ev) {
  const turnId = ev.data.turn_id;
  if (!turnId) return;
  if (!devlogTurns.has(turnId)) devlogOrder.push(turnId);
  const prev = devlogTurns.get(turnId) || {};
  devlogTurns.set(turnId, mergeDevlogEvent(prev, ev.event, ev.data));
  renderDevlogCard(turnId);
}

async function connectDevlog() {
  for (;;) {
    try {
      const res = await fetch("/api/devlog");
      if (res.status === 403 || res.status === 404) { setDevlogStatus("disabled"); return; }
      if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
      setDevlogStatus("live");
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      const parser = createSSEParser();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        for (const ev of parser.push(decoder.decode(value, { stream: true }))) handleDevlogEvent(ev);
      }
    } catch (e) { /* fall through to reconnect */ }
    setDevlogStatus("reconnecting");
    await new Promise((r) => setTimeout(r, 1000));
  }
}
connectDevlog();
</script>
</body>
</html>
