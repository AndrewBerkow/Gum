[project]
name = "gum"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-typesafe==0.0.1a3",
    "httpx2",
    "langchain-google-genai>=4,<5",
    "pydantic-settings",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-socket",
    "httpx",
    "ruff",
    "pyright",
    "playwright",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["e2e: browser tests", "live: tests needing real API keys"]
addopts = "-m 'not live' --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
