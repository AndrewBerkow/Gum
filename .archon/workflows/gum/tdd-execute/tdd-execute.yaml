name: tdd-execute
description: |
  Archon Execution Framework: take an execution plan (default PLAN.md), split it
  into 3-5 independently testable tasks, then run each task in order:
  top-level integration tests first (proven red), micro-task red/green/refactor,
  and top-level validation with up to 3 fix attempts. If the tests are still red
  after the third fix, write a diagnostic report and halt: fix the code, then
  `archon workflow resume`. Runs unattended: no approval gates.
  Use: archon workflow run tdd-execute --branch <name> "Execute PLAN.md" --detach
model: large
interactive: false
inputs:
  plan:
    default: PLAN.md
    description: Path to the execution plan, relative to the repo root

nodes:
  # ---- 1. Plan decomposition (macro level) ----
  - id: decompose
    command: decompose
    output_format:
      type: object
      properties:
        task_count: {type: integer}
      required: [task_count]

  - id: check-decomposition
    script: check-decomposition
    runtime: uv
    depends_on: [decompose]

  # ---- 2-4. Per-task sub-workflow, one task per iteration ----
  - id: task-cycle
    depends_on: [check-decomposition]
    loop_group:
      max_iterations: 5
      # Ends after the last task.
      until_bash: 'test "$record-progress.output.all_done" = "true"'
      nodes:
        - id: pick-task
          script: pick-task
          runtime: uv
          output_format:
            type: object
            properties:
              index: {type: integer}
              task_id: {type: string}
              title: {type: string}
              test_command: {type: string}
              total: {type: integer}
            required: [index, task_id, title, test_command, total]

        # 3.1 Top-level integration tests, no functional code
        - id: integration-tests
          command: integration-tests
          model: '@coder'
          depends_on: [pick-task]
          context: fresh

        - id: tests-red
          script: tests-red
          runtime: uv
          depends_on: [integration-tests]
          with:
            test_command: "$pick-task.output.test_command"
            task_id: "$pick-task.output.task_id"

        # 3.2 + 3.3 Micro-task breakdown and micro-TDD loop
        - id: implement
          command: implement
          model: '@coder'
          depends_on: [tests-red]

        # 3.4 Top-level validation, attempt 1
        - id: validate-1
          script: run-tests
          runtime: uv
          depends_on: [implement]
          with:
            test_command: "$pick-task.output.test_command"
            task_id: "$pick-task.output.task_id"
            attempt: "1"
            strict: "false"
          output_format:
            type: object
            properties:
              passed: {type: boolean}
              log_path: {type: string}
            required: [passed, log_path]

        # 3.5 Validation failure: route back to implementation, up to 3 fix
        # attempts. Each fix/validate pair is skipped once a validation passes.
        - id: fix-1
          command: fix
          model: '@coder'
          depends_on: [validate-1]
          when: "$validate-1.output.passed == false"
          with:
            attempt: "1"
            log_path: "$validate-1.output.log_path"

        - id: validate-2
          script: run-tests
          runtime: uv
          depends_on: [fix-1]
          with:
            test_command: "$pick-task.output.test_command"
            task_id: "$pick-task.output.task_id"
            attempt: "2"
            strict: "false"
          output_format:
            type: object
            properties:
              passed: {type: boolean}
              log_path: {type: string}
            required: [passed, log_path]

        - id: fix-2
          command: fix
          model: '@coder'
          depends_on: [validate-2]
          when: "$validate-2.output.passed == false"
          with:
            attempt: "2"
            log_path: "$validate-2.output.log_path"

        - id: validate-3
          script: run-tests
          runtime: uv
          depends_on: [fix-2]
          with:
            test_command: "$pick-task.output.test_command"
            task_id: "$pick-task.output.task_id"
            attempt: "3"
            strict: "false"
          output_format:
            type: object
            properties:
              passed: {type: boolean}
              log_path: {type: string}
            required: [passed, log_path]

        - id: fix-3
          command: fix
          model: '@coder'
          depends_on: [validate-3]
          when: "$validate-3.output.passed == false"
          with:
            attempt: "3"
            log_path: "$validate-3.output.log_path"

        - id: validate-4
          script: run-tests
          runtime: uv
          depends_on: [fix-3]
          with:
            test_command: "$pick-task.output.test_command"
            task_id: "$pick-task.output.task_id"
            attempt: "4"
            strict: "false"
          output_format:
            type: object
            properties:
              passed: {type: boolean}
              log_path: {type: string}
            required: [passed, log_path]

        # Still red after 3 fixes: diagnostic report, then halt
        - id: diagnose
          command: diagnose
          depends_on: [validate-4]
          when: "$validate-4.output.passed == false"
          context: fresh

        # Halts the run while the tests are red. After a human fixes the code,
        # `archon workflow resume <run-id>` re-runs this and continues if green.
        # Runs only if nothing upstream failed (fix/validate/diagnose nodes may be skipped).
        - id: halt-unless-green
          script: run-tests
          runtime: uv
          depends_on: [validate-1, validate-2, validate-3, validate-4, diagnose]
          trigger_rule: none_failed_min_one_success
          with:
            test_command: "$pick-task.output.test_command"
            task_id: "$pick-task.output.task_id"
            attempt: "final"
            strict: "true"

        # 4. Completion summary
        - id: summarize
          command: summarize
          depends_on: [halt-unless-green]
          context: fresh

        - id: record-progress
          script: record-progress
          runtime: uv
          depends_on: [summarize]
          with:
            task_id: "$pick-task.output.task_id"
          output_format:
            type: object
            properties:
              all_done: {type: boolean}
              next_title: {type: string}
            required: [all_done, next_title]

